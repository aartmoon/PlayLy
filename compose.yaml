services:
  traefik:
    image: traefik:v3.7.17
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik:/etc/traefik/dynamic:ro
    networks: [edge]

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks: [edge, data, generation]

  ai:
    build: ./ai
    networks: [generation]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playly
      POSTGRES_USER: playly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playly-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [generation]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-playly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-playly-local}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [generation]

networks:
  edge:
  data:
  generation:

volumes:
  postgres-data:
  kafka-data:
  minio-data:
