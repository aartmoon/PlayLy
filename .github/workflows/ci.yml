name: CI and Docker Hub

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
        working-directory: mobile
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-lint-report
          path: |
            mobile/app/build/reports/lint-results-debug.*
            mobile/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-26.04
    env:
      COMPOSE_PROJECT_NAME: playly
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          targets: core,ai
          load: true
          set: |
            core.tags=playly-core
            ai.tags=playly-ai
            core.cache-from=type=gha,scope=playly-core-smoke
            core.cache-to=type=gha,scope=playly-core-smoke,mode=max
            ai.cache-from=type=gha,scope=playly-ai-smoke
            ai.cache-to=type=gha,scope=playly-ai-smoke,mode=max
      - run: |
          docker compose up -d --no-build --wait --wait-timeout 240 traefik core ai langfuse-worker
          docker compose run --rm --no-deps storage-init
          docker compose run --rm --no-deps --entrypoint /bin/sh storage-init /storage/smoke.sh
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/actuator/health
          api=http://127.0.0.1:8080/api/v1
          curl -fsS "$api/catalog/games" | jq -e '.items == [] and .nextCursor == null'
          tokens=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":" smoke@example.com ","password":"playly-smoke","displayName":"CI"}' "$api/auth/register")
          access=$(jq -er .accessToken <<< "$tokens")
          game=$(curl -fsS -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -d '{"title":"Smoke","description":""}' "$api/games")
          game_id=$(jq -er .id <<< "$game")
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$api/games/$game_id")" = 404
          endpoint="$api/games/$game_id/generations"
          args=(-fsS -H "Authorization: Bearer $access" -H 'Content-Type: application/json' -H 'Idempotency-Key: smoke' -d '{"prompt":"Create a game"}')
          first=$(curl "${args[@]}" "$endpoint" | jq -er .id)
          second=$(curl "${args[@]}" "$endpoint" | jq -er .id)
          test "$first" = "$second"
          curl -fsS -H "Authorization: Bearer $access" "$api/generations/$first" | jq -e '.status == "QUEUED"'
          event_id=$(cat /proc/sys/kernel/random/uuid)
          result=$(jq -cn --arg event "$event_id" --arg job "$first" --arg game "$game_id" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{eventId:$event,schemaVersion:1,generationId:$job,gameId:$game,occurredAt:$time,type:"FAILED",error:{code:"UNSUPPORTED_GAME_REQUEST",message:"unsupported"}}')
          printf '%s|%s\n' "$first" "$result" | docker compose exec -T kafka /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server kafka:9092 --topic game.generation.result --property parse.key=true --property 'key.separator=|'
          for attempt in {1..20}; do
            job=$(curl -fsS -H "Authorization: Bearer $access" "$api/generations/$first")
            if jq -e '.status == "FAILED" and .error.code == "UNSUPPORTED_GAME_REQUEST"' <<< "$job"; then
              break
            fi
            sleep 1
          done
          jq -e '.status == "FAILED" and .error.code == "UNSUPPORTED_GAME_REQUEST"' <<< "$job"
          refresh_body=$(jq -c '{refreshToken}' <<< "$tokens")
          curl -fsS -H 'Content-Type: application/json' -d "$refresh_body" "$api/auth/refresh" | jq -e '.refreshToken | length > 0'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$refresh_body" "$api/auth/refresh")" = 401
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -aq ai)")" = true
      - if: failure()
        run: |
          docker compose logs
          web_id="$(docker compose ps -aq langfuse-web)"
          if [ -n "$web_id" ]; then
            docker inspect --format '{{json .State.Health}}' "$web_id"
          fi
      - if: always()
        run: docker compose down

  publish:
    if: github.event_name == 'push'
    needs: [android, containers]
    concurrency:
      group: dockerhub-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: backend/Dockerfile
            image: playly-core
          - context: ./ai
            dockerfile: ai/Dockerfile
            image: playly-ai
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=gha,scope=${{ matrix.image }}-release
            type=gha,scope=${{ matrix.image }}-smoke
          cache-to: type=gha,scope=${{ matrix.image }}-release,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
