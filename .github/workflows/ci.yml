name: CI and Docker Hub

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
        working-directory: mobile
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-lint-report
          path: |
            mobile/app/build/reports/lint-results-debug.*
            mobile/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-26.04
    env:
      COMPOSE_PROJECT_NAME: playly
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          targets: core,ai
          load: true
          set: |
            core.tags=playly-core
            ai.tags=playly-ai
            core.cache-from=type=gha,scope=playly-core-smoke
            core.cache-to=type=gha,scope=playly-core-smoke,mode=max
            ai.cache-from=type=gha,scope=playly-ai-smoke
            ai.cache-to=type=gha,scope=playly-ai-smoke,mode=max
      - run: |
          docker compose up -d --no-build --no-deps traefik core ai
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/actuator/health
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/catalog/games)" = 501
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -aq ai)")" = true
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  publish:
    if: github.event_name == 'push'
    needs: [android, containers]
    concurrency:
      group: dockerhub-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: backend/Dockerfile
            image: playly-core
          - context: ./ai
            dockerfile: ai/Dockerfile
            image: playly-ai
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=gha,scope=${{ matrix.image }}-release
            type=gha,scope=${{ matrix.image }}-smoke
          cache-to: type=gha,scope=${{ matrix.image }}-release,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
